<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubweb - Custom Websites</title>
    <link rel="stylesheet" href="./Bt03.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="logo">Besnik<span>.</span></div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">Pricing</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="auth-buttons">
            <a href="#" class="btn-login">Sign in</a>
            <a href="#" class="btn-signup">Sign up</a>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <p class="badge">😎 EASY LEARNING PLATFORM</p>
            <h1>Words learner <br> come here.</h1>
            <p class="description">
                Build skills with courses, certificates, and <br>
                get online knowledge from our world-class platform.
            </p>
            <div class="cta-group">
                <button class="btn-get-started">Get Started</button>
                <button class="btn-play"><span>▶</span></button>
            </div>
        </div>

        <div class="hero-image-container">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80"
                alt="Student" class="main-img">

            <div class="floating-card courses-card">
                <div class="icon-box"></div>
                <div>
                    <p class="card-title">Courses</p>
                    <p class="card-subtitle">1000+</p>
                </div>
            </div>

            <div class="floating-card students-card">
                <p>Our Active Students</p>
                <div class="avatars">
                    <div class="avatar"></div>
                    <div class="avatar"></div>
                    <div class="avatar"></div>
                    <span class="count">10K+</span>
                </div>
            </div>
        </div>
    </header>

</body>

</html>


</body>

</html>
