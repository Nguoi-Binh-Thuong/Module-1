<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bt 07</title>
</head>
<body>
    <form id="form">
    <table>
        <tr>
            <th bgcolor="orange" colspan="4">SỞ THÍCH CỦA BẠN</th>
        </tr>
        <tr>
            <td colspan="4">
                <label for="name">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Họ và tên</label>
                <input type="text" id="name" name="name">
            </td>
        </tr>
        <tr>
            <td colspan="4">
                <label for="email">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Email</label>
                <input type="email" id="email" name="email">
            </td>
        </tr>
            <td align="right">
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Sở thích<br/>&nbsp;<br/>&nbsp;
            </td>
            <td>
                <input type="checkbox" id="tt" name="hobby">
                <label for="tt">Thể thao</label>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <br/>
                <input type="checkbox" id="web" name="hobby">
                <label for="web">Lướt web</label>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <br/>
                <input type="checkbox" id="dl" name="hobby">
                <label for="dl">Du lịch</label>
            </td>
            <td>
                <input type="checkbox" id="music" name="hobby">
                <label for="music">Âm nhạc</label>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <br/>
                <input type="checkbox" id="game" name="hobby">
                <label for="game">Chơi game</label>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <br/>&nbsp;
            </td>
            <td>
                <input type="checkbox" id="read" name="hobby">
                <label for="read">Đọc sách</label>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <br/>
                <input type="checkbox" id="movie" name="hobby">
                <label for="movie">Điện ảnh</label>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <br/>&nbsp;
            </td>
        <tr>
            <td>
                &nbsp;
            </td>
            <td colspan="2">
                <button type="button">Gửi thông tin</button>
            <button type="reset" form="form">Nhập lại</button>
            </td>
        </tr>
    </table>
    </form>
</body>
</html>
