<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-b2</title>
</head>
<body>
    <h1>Booking form</h1>
    <form>
        <label for="name">Name:</label>
        <input id="name" type="text" name="name"><br/><br/>
        <label for="mail">Email:</label>
        <input id="mail" type="email" name="email"><br/><br/>
        <label for="phone">Phone:</label>
        <input id="phone" type="tel" name="phone"><br/><br/>
        <label for="date">Date:</label>
        <input id="date" type="date" name="date"><br/><br/>
        <label for="time">Time:</label>
        <input id="time" type="time" name="time"><br/><br/>
        <label for="guest">Number of Guests:</label>
        <input id="guest" type="number" min="0" name="guest"><br/><br/>
        <button type="button">Submit</button>
    </form>
</body>
</html>
