<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06</title>
</head>
<body>
    <header>
        <h1>Trang web bán hàng</h1>
        <nav>
            <ul>
                <li><a href="https://www.google.com/">Trang chủ</a></li>
                <li><a href="https://www.google.com/">Sản phẩm</a></li>
                <li><a href="https://www.google.com/">Giới thiệu</a></li>
                <li><a href="https://www.google.com/">Liên hệ</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Thông tin sản phẩm</h2>
            <table border ="1">
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Mô tả</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                </tr>
                <tr>
                    <td>Sản phẩm 1</td>
                    <td>Mô tả sản phẩm 1</td>
                    <td>100.000đ</td>
                    <td>10</td>
                </tr>
                <tr>
                    <td>Sản phẩm 2</td>
                    <td>Mô tả sản phẩm 2</td>
                    <td>200.000đ</td>
                    <td>5</td>
                </tr>
                <tr>
                    <td>Sản phẩm 3</td>
                    <td>Mô tả sản phẩm 3</td>
                    <td>300.000đ</td>
                    <td>3</td>
                </tr>
            </table>
        </section>
        <section>
            <h2>Thông tin người dùng</h2>
            <form>
                <label for="name">Họ và tên: </label>
                <input id="name" type="text" name="name"/><br/>
                <label for="mail">Email: </label>
                <input id="mail" type="email" name="mail" /><br/>
                <label for="tel">Số điện thoại: </label>
                <input id="tel" type="tel" name="tel" /><br/>
                <label for="address">Địa chỉ: </label>
                <input id="address" type="text" name="address" /><br/>
                <button type="button">Đặt hàng</button>
            </form>
        </section>
    </main><br/>
    <footer>
        &copy;2023 Trang web bán hàng
    </footer>
</body>
</html>
