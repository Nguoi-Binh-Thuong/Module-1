<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-b3</title>
</head>
<body>
    <h1>Car Purchase Form</h1>
    <form>
        <label for="name">Name:</label>
        <input id="name" type="text" name="name"><br/><br/>
        <label for="mail">Email:</label>
        <input id="mail" type="email" name="email"><br/><br/>
        <label for="phone">Phone:</label>
        <input id="phone" type="tel" name="phone"><br/><br/>
        <label for="model">Choose a Car:</label>
        <select id="model" name="model">
            <option value="model 1">Model 1</option>
        </select><br/><br/>
        <label for="color">Choose a Color:</label>
        <select id="color" name="coloor">
            <option value="Red">Red</option>
        </select><br/><br/>
        <label for="quantity">Quantity:</label>
        <input id="quantity" type="number" min="0" name="Quantity"><br/><br/>
        <label for="deliverdate">Delivery date:</label>
        <input id="deliverdate" type="date" name="deliverdate"><br/><br/>
        <button type="button">Submit</button>
    </form>
</body>
</html>
